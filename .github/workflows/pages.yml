name: GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p public/js public/images
          cp index.html public/index.html
          cp "Portfólio Brian/Portfólio Brian.Client/wwwroot/app.css" public/app.css
          cp "Portfólio Brian/Portfólio Brian.Client/wwwroot/js/site.js" public/js/site.js
          cp "Portfólio Brian/Portfólio Brian.Client/wwwroot/images/brian.png" public/images/brian.png
          cp public/index.html public/404.html
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
